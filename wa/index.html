<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EPN · Envíos WhatsApp</title>
<style>
  :root { --verde:#0E3023; --cobre:#A0612D; --wa:#25D366; --bg:#F5F5F3; --txt:#1A1A1A; --gris:#6b6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--txt); padding:0 0 48px; }
  header { background:var(--verde); color:#fff; padding:18px 18px 16px; position:sticky; top:0; z-index:5; }
  header .k { font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; opacity:.78; }
  header h1 { margin:3px 0 0; font-size:20px; font-weight:700; }
  header .sub { font-size:12.5px; opacity:.85; margin-top:4px; }
  .wrap { max-width:480px; margin:0 auto; padding:14px; }
  .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.07); margin-bottom:18px; }
  .meta { display:flex; align-items:center; gap:8px; padding:12px 14px 0; flex-wrap:wrap; }
  .badge { font-size:11px; font-weight:700; color:#fff; background:var(--verde); border-radius:20px; padding:3px 10px; }
  .fecha { font-size:12px; color:var(--gris); }
  .tit { padding:6px 14px 0; font-size:16px; font-weight:700; }
  .placa { width:100%; display:block; margin-top:10px; }
  .cap { padding:12px 14px; white-space:pre-wrap; font-size:14px; line-height:1.5; color:#222;
         max-height:7.5em; overflow:hidden; position:relative; transition:max-height .25s; }
  .cap.open { max-height:none; }
  .cap a { color:var(--cobre); word-break:break-all; }
  .vermas { display:block; width:100%; background:none; border:none; color:var(--cobre);
            font-size:12.5px; font-weight:600; padding:0 14px 8px; text-align:left; cursor:pointer; }
  .btns { padding:0 14px 14px; }
  .btn-wa { display:flex; align-items:center; justify-content:center; gap:9px; width:100%; border:none;
            border-radius:13px; padding:15px; font-size:16px; font-weight:700; cursor:pointer;
            background:var(--wa); color:#fff; box-shadow:0 4px 12px rgba(37,211,102,.38); }
  .btn-wa:active { transform:translateY(1px); }
  .row { display:flex; gap:9px; margin-top:9px; }
  .btn-sec { flex:1; background:#fff; color:var(--verde); border:1.5px solid #d7d7d1; border-radius:11px;
             padding:11px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-sec:active { background:#f0f0ec; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--verde);
           color:#fff; padding:11px 18px; border-radius:30px; font-size:13.5px; font-weight:600;
           box-shadow:0 4px 16px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; }
  .toast.show { opacity:1; }
  .foot { font-size:12px; color:var(--gris); text-align:center; padding:4px 18px; line-height:1.55; }
</style>
</head>
<body>
<header>
  <div class="k">EPN · Power Marketing</div>
  <h1>Envíos WhatsApp</h1>
  <div class="sub">Tocá <b>Compartir</b> y elegí la comunidad. (WhatsApp Web: copiá imagen + texto.)</div>
</header>
<div class="wrap" id="lista"></div>
<p class="foot">📱 Cel o app de escritorio → botón verde (foto + texto).<br>🌐 WhatsApp Web → Copiar imagen (Ctrl+V) + Copiar texto.</p>
<div class="toast" id="toast"></div>

<script>
const ENVIOS = [{"id": "vits-w1", "titulo": "VITS · Próximamente", "fecha": "Pieza 1 · arranque", "seg": "B2B · Mayorista", "placa": "placas/vits-w1.jpg", "caption": "👀 *Se viene algo nuevo a EPN.*\n\nUna marca premium de bienestar que tus clientes _ya buscan por nombre_ — y muy pronto la vas a poder tener en tu mostrador.\n\nTe la vamos a ir contando de a poco, semana a semana. El que quiera ser de los primeros en tener los precios, que escriba *VITS* 👇\n\n_P.D.: ¿querés seguir las novedades con todo el detalle por mail?_ Suscribite 👉 https://manage.kmail-lists.com/subscriptions/subscribe?a=WMv7yF&g=UX5VSJ\n\n—\n✅ mayoristas.epnstore.com.ar\n📲 +54 9 11 6687-0378"}, {"id": "vits-w2", "titulo": "VITS · Los números", "fecha": "Pieza 2 · credibilidad", "seg": "B2B · Mayorista", "placa": "placas/vits-w2.jpg", "caption": "📊 *Una marca que ya rota afuera.*\n\nVITS llega con reseñas, demanda real y certificaciones que respaldan cada producto. Tus clientes _ya la conocen_ — solo falta que la tengas vos.\n\nEl que quiera ver el catálogo y los precios, que escriba *VITS* 👇\n\n—\n✅ mayoristas.epnstore.com.ar\n📲 +54 9 11 6687-0378"}, {"id": "vits-w3", "titulo": "VITS · NAD+ Resveratrol", "fecha": "Pieza 3 · producto héroe", "seg": "B2B · Mayorista", "placa": "placas/vits-w3.jpg", "caption": "🧬 *El antiage que ya te van a pedir.*\n\nNAD+ con Resveratrol es de lo más buscado en bienestar y biohacking. Con VITS lo tenés para tu mostrador, con fórmulas limpias y calidad certificada.\n\n¿Lo sumás? Escribí *VITS* y te pasamos precios 👇\n\n—\n✅ mayoristas.epnstore.com.ar\n📲 +54 9 11 6687-0378"}, {"id": "vits-w4", "titulo": "VITS · Omega 3", "fecha": "Pieza 4 · best-seller", "seg": "B2B · Mayorista", "placa": "placas/vits-w4.jpg", "caption": "🐟 *El Omega 3 que el cliente busca por nombre.*\n\nOmega 3 con pureza certificada (IFOS), de los más elegidos online. De los que _vuelan de la góndola_.\n\nEl que lo quiera tener en stock, que escriba *VITS* 👇\n\n—\n✅ mayoristas.epnstore.com.ar\n📲 +54 9 11 6687-0378"}];

function fmt(t){
  let s = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
  s = s.replace(/_([^_\n]+)_/g,'<i>$1</i>');
  s = s.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\n/g,'<br>');
}

const lista = document.getElementById('lista');
ENVIOS.forEach((e, i) => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML =
    '<div class="meta"><span class="badge">'+e.seg+'</span><span class="fecha">'+e.fecha+'</span></div>'+
    '<div class="tit">'+e.titulo+'</div>'+
    '<img class="placa" src="'+e.placa+'" alt="'+e.titulo+'" loading="lazy">'+
    '<div class="cap" id="cap'+i+'">'+fmt(e.caption)+'</div>'+
    '<button class="vermas" onclick="toggle('+i+')" id="vm'+i+'">Ver más ▾</button>'+
    '<div class="btns">'+
      '<button class="btn-wa" onclick="compartir('+i+')">'+
        '<svg width="21" height="21" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.7.8-2.7-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5.2-.4v-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3a3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3z"/></svg>'+
        'Compartir por WhatsApp</button>'+
      '<div class="row">'+
        '<button class="btn-sec" onclick="copiarImg('+i+')">🖼️ Copiar imagen</button>'+
        '<button class="btn-sec" onclick="copiarTexto('+i+')">📋 Copiar texto</button>'+
      '</div>'+
    '</div>';
  lista.appendChild(c);
  // mostrar "Ver más" solo si el texto se recorta
  requestAnimationFrame(()=>{ const cap=document.getElementById('cap'+i);
    if (cap.scrollHeight <= cap.clientHeight + 4) document.getElementById('vm'+i).style.display='none'; });
});

function toggle(i){ const cap=document.getElementById('cap'+i), vm=document.getElementById('vm'+i);
  cap.classList.toggle('open'); vm.textContent = cap.classList.contains('open') ? 'Ver menos ▴' : 'Ver más ▾'; }

async function placaFile(e){
  const res = await fetch(e.placa); const blob = await res.blob();
  return new File([blob], e.id+'.jpg', { type:'image/jpeg' });
}

async function compartir(i){
  const e = ENVIOS[i];
  try {
    const file = await placaFile(e);
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], text:e.caption }); return;
    }
  } catch(err){ if (err && err.name === 'AbortError') return; }
  window.location.href = 'https://wa.me/?text=' + encodeURIComponent(e.caption);
}

async function copiarImg(i){
  const e = ENVIOS[i];
  try {
    const res = await fetch(e.placa); const blob = await res.blob();
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    const png = await new Promise(r => c.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    toast('✓ Imagen copiada — pegala con Ctrl+V');
  } catch(err){ toast('No pude copiar la imagen (probá online / Bajar)'); }
}

async function copiarTexto(i){
  try { await navigator.clipboard.writeText(ENVIOS[i].caption); toast('✓ Texto copiado'); }
  catch(err){ toast('No pude copiar el texto'); }
}

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }
</script>
</body>
</html>
